<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada | FA Asesoría Global</title>
    <meta name="description" content="La página que buscas no existe. Vuelve al inicio de FA Asesoría Global.">
    
    <!-- Fuentes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- Tus CSS -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animaciones.css">

    <style>
        /* Estilos específicos para la página 404 */
        body {
            background-color: var(--bg-offwhite);
            font-family: var(--font-body);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .error-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        .error-content {
            max-width: 600px;
            animation: fadeIn 0.8s ease-out;
        }

        .error-code {
            font-family: var(--font-heading);
            font-size: 8rem;
            font-weight: 700;
            color: var(--accent-orange);
            line-height: 1;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .error-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
        }

        .error-message {
            font-size: 1.1rem;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 2.5rem;
        }

        .btn-home {
            display: inline-block;
            background-color: #f57c00 !important; /* NARANJA FIJO */
            color: #ffffff !important; /* BLANCO FIJO */
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 124, 0, 0.4);
            border: 2px solid #f57c00;
        }

        .btn-home:hover {
            background-color: #d86c00 !important;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(245, 124, 0, 0.4);
            color: white !important;
            text-decoration: none;
        }

        .logo-small {
            margin-bottom: 2rem;
            max-width: 150px;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            object-fit: cover;
        }
        
        .simple-footer {
            text-align: center;
            padding: 2rem;
            background: var(--primary);
            color: white;
            font-size: 0.9rem;
        }
        .simple-footer a { color: var(--accent-yellow); text-decoration: none; }

        @media (max-width: 768px) {
            .error-code { font-size: 6rem; }
            .error-title { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <!-- Contenedor Principal -->
    <div class="error-wrapper">
        <div class="error-content">
            
            <!-- Logo -->
            <img src="img/fa.jpg" alt="FA Asesoría Global" class="logo-small">

            <!-- Número Gigante 404 (No se traduce) -->
            <div class="error-code">404</div>
            
            <!-- Título Traducible -->
            <h1 class="error-title" data-lang="error_404_title">¡Ups! Página no encontrada</h1>
            
            <!-- Mensaje Traducible -->
            <p class="error-message" data-lang="error_404_message">
                Parece que te has perdido en el proceso legal. <br>
                La página que buscas no existe o ha sido movida. <br>
                No te preocupes, podemos ayudarte a encontrar el camino de vuelta.
            </p>
            
            <!-- Botón Traducible -->
            <a href="index.html" class="btn-home" data-lang="error_404_btn">← Volver al Inicio</a>
        </div>
    </div>

    <!-- Footer Simple Traducible -->
    <footer class="simple-footer">
        <p data-lang="error_404_footer">&copy; 2026 FA Asesoría Global. ¿Necesitas ayuda? <a href="mailto:faasesoriaglobal@gmail.com">Contáctanos</a></p>
    </footer>

    <!-- CARGAR SCRIPT DE IDIOMAS (Importante) -->
    <script src="js/idiomas.js"></script>
</body>
</html>
